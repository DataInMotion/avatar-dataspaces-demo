/*
 * build Gradle build script
 */

task prepareDocker(){
	def stageDir = file('content')
	def runtimeDir = new File(stageDir, 'runtime')
	doFirst {
		stageDir.deleteDir()
    }
    doLast {
		println "Prepare Docker build"
		stageDir.mkdirs()
	     // copy all necessary files to  build/docker/ dir
    	copy {
	        from new File("../de.avatar.connectors.demo.rsa.provider/generated/distributions/executable/provider.jar")
	        into stageDir
            rename("provider.jar", "de.avatar.connectors.provider.jar")
	    }
    }
}
