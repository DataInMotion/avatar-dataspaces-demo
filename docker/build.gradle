task prepareDockerISMA(){
	def stageDir = file('isma/content')
	def runtimeDir = new File(stageDir, 'runtime')
	doFirst {
		stageDir.deleteDir()
    }
    doLast {
		println "Prepare Docker build"
		stageDir.mkdirs()
	     // copy all necessary files to  build/docker/ dir
    	copy {
	        from new File("../de.avatar.connector.isma/generated/distributions/executable/isma_provider.jar")
	        into stageDir
            rename("isma_provider.jar", "de.avatar.connector.isma.provider.jar")
	    }
    }
}

